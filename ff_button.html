<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #191919;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #1e1e1e;
    border: 1px solid rgba(226,75,74,0.3);
    border-radius: 10px;
    padding: 14px 22px;
    text-decoration: none;
    color: #e0e0e0;
    transition: all .2s;
    cursor: pointer;
  }
  .btn:hover {
    background: rgba(226,75,74,0.08);
    border-color: rgba(226,75,74,0.6);
    transform: translateY(-1px);
  }
  .icon {
    width: 32px;
    height: 32px;
    background: rgba(226,75,74,0.12);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .label { font-size: 13px; font-weight: 600; color: #e0e0e0; letter-spacing: .01em; }
  .sub { font-size: 11px; color: #555; margin-top: 2px; }
  .arrow { margin-left: 8px; color: #444; font-size: 14px; transition: color .2s; }
  .btn:hover .arrow { color: #e07070; }
</style>
</head>
<body>
  <a class="btn"
     href="https://www.forexfactory.com/calendar?impact=red&currency=usd"
     target="_blank"
     rel="noopener">
    <div class="icon">📅</div>
    <div>
      <div class="label">Forex Factory Calendar</div>
      <div class="sub">🇺🇸 USD · Red impact only</div>
    </div>
    <span class="arrow">↗</span>
  </a>
</body>
</html>
